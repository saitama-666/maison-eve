        fill="none" stroke="#c9a877" stroke-width="5.8" opacity="0.09"/><circle cx="456.8" cy="438.8" r="18" fill="#c9a877" opacity="0.072"/>
    <circle cx="1035.4" cy="419.2" r="54.7" fill="#f3d9a8" opacity="0.118"/><circle cx="1175.2" cy="6.2" r="71.3" fill="#f3d9a8" opacity="0.133"/><circle cx="354.4" cy="102.4" r="61.5" fill="#f3d9a8" opacity="0.136"/><circle cx="1151.2" cy="171.6" r="83.1" fill="#f3d9a8" opacity="0.116"/><circle cx="134.5" cy="171.5" r="41.8" fill="#f3d9a8" opacity="0.074"/><circle cx="56.2" cy="401.1" r="86.8" fill="#f3d9a8" opacity="0.122"/><circle cx="60.2" cy="94.9" r="36.3" fill="#f3d9a8" opacity="0.114"/>
