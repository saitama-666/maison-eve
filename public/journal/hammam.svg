        fill="none" stroke="#d8b98c" stroke-width="5.8" opacity="0.09"/><circle cx="328.5" cy="438.8" r="18" fill="#d8b98c" opacity="0.072"/><path d="M 456.8 0.1 L 510.6 54 L 456.8 107.9 L 402.9 54 Z"
