        fill="none" stroke="#d8b98c" stroke-width="5.8" opacity="0.09"/><circle cx="456.8" cy="310.5" r="18" fill="#d8b98c" opacity="0.072"/><path d="M 456.8 384.9 L 510.6 438.8 L 456.8 492.6 L 402.9 438.8 Z"
        fill="none" stroke="#d8b98c" stroke-width="5.8" opacity="0.09"/><circle cx="456.8" cy="438.8" r="18" fill="#d8b98c" opacity="0.072"/>
