        fill="none" stroke="#d8b98c" stroke-width="6.8" opacity="0.09"/><circle cx="504" cy="368" r="21.3" fill="#d8b98c" opacity="0.072"/><path d="M 504 456.2 L 567.8 520 L 504 583.8 L 440.2 520 Z"
        fill="none" stroke="#d8b98c" stroke-width="6.8" opacity="0.09"/><circle cx="504" cy="520" r="21.3" fill="#d8b98c" opacity="0.072"/>
    <circle cx="546.7" cy="545.9" r="45.3" fill="#f6e4c6" opacity="0.134"/><circle cx="714.7" cy="16.9" r="83.2" fill="#f6e4c6" opacity="0.115"/><circle cx="752.2" cy="492.4" r="77.5" fill="#f6e4c6" opacity="0.132"/><circle cx="787" cy="356.7" r="47.8" fill="#f6e4c6" opacity="0.069"/><circle cx="124" cy="424.6" r="66.9" fill="#f6e4c6" opacity="0.062"/><circle cx="246.8" cy="303.5" r="37.8" fill="#f6e4c6" opacity="0.063"/><circle cx="474.4" cy="427.4" r="56.7" fill="#f6e4c6" opacity="0.059"/>
  </g>

