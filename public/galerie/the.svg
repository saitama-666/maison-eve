        fill="none" stroke="#e0b878" stroke-width="6" opacity="0.09"/><circle cx="441" cy="475" r="18.6" fill="#e0b878" opacity="0.072"/>
    <circle cx="447.3" cy="385.6" r="80.9" fill="#ffd89d" opacity="0.105"/><circle cx="94.6" cy="71.1" r="87.1" fill="#ffd89d" opacity="0.107"/><circle cx="226.6" cy="626.5" r="65.2" fill="#ffd89d" opacity="0.075"/><circle cx="84.5" cy="469" r="71" fill="#ffd89d" opacity="0.073"/><circle cx="528.6" cy="634.4" r="62.6" fill="#ffd89d" opacity="0.076"/><circle cx="63.7" cy="303.2" r="73.4" fill="#ffd89d" opacity="0.117"/><circle cx="407.4" cy="132.5" r="76.9" fill="#ffd89d" opacity="0.052"/>
  </g>

