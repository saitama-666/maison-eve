    <circle cx="338" cy="484.5" r="35" fill="#f3d9a8" opacity="0.124"/><circle cx="489.8" cy="563.2" r="81.3" fill="#f3d9a8" opacity="0.078"/><circle cx="210.2" cy="34.9" r="85.8" fill="#f3d9a8" opacity="0.111"/><circle cx="202.9" cy="585.4" r="52" fill="#f3d9a8" opacity="0.111"/><circle cx="183.4" cy="174.9" r="45.8" fill="#f3d9a8" opacity="0.119"/><circle cx="288.2" cy="39.7" r="28.7" fill="#f3d9a8" opacity="0.108"/><circle cx="408.1" cy="334.8" r="32.7" fill="#f3d9a8" opacity="0.140"/>
