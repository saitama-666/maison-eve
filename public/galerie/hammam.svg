        fill="none" stroke="#d8b98c" stroke-width="6.2" opacity="0.09"/><circle cx="339.6" cy="331.2" r="19.2" fill="#d8b98c" opacity="0.072"/><path d="M 339.6 410.5 L 397.1 468 L 339.6 525.5 L 282.1 468 Z"
        fill="none" stroke="#d8b98c" stroke-width="6.2" opacity="0.09"/><circle cx="339.6" cy="468" r="19.2" fill="#d8b98c" opacity="0.072"/><path d="M 476.4 0.1 L 533.9 57.6 L 476.4 115.1 L 418.9 57.6 Z"
