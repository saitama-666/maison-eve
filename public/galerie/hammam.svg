        fill="none" stroke="#d8b98c" stroke-width="6.2" opacity="0.09"/><circle cx="476.4" cy="194.4" r="19.2" fill="#d8b98c" opacity="0.072"/><path d="M 476.4 273.7 L 533.9 331.2 L 476.4 388.7 L 418.9 331.2 Z"
        fill="none" stroke="#d8b98c" stroke-width="6.2" opacity="0.09"/><circle cx="476.4" cy="331.2" r="19.2" fill="#d8b98c" opacity="0.072"/><path d="M 476.4 410.5 L 533.9 468 L 476.4 525.5 L 418.9 468 Z"
        fill="none" stroke="#d8b98c" stroke-width="6.2" opacity="0.09"/><circle cx="476.4" cy="468" r="19.2" fill="#d8b98c" opacity="0.072"/>
