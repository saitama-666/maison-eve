        fill="none" stroke="#c9a877" stroke-width="6.8" opacity="0.09"/><circle cx="504" cy="368" r="21.3" fill="#c9a877" opacity="0.072"/><path d="M 504 456.2 L 567.8 520 L 504 583.8 L 440.2 520 Z"
        fill="none" stroke="#c9a877" stroke-width="6.8" opacity="0.09"/><circle cx="504" cy="520" r="21.3" fill="#c9a877" opacity="0.072"/>
    <circle cx="193.4" cy="60.6" r="76" fill="#f3d9a8" opacity="0.102"/><circle cx="253.6" cy="182.4" r="45.4" fill="#f3d9a8" opacity="0.129"/><circle cx="782.4" cy="387.2" r="39.8" fill="#f3d9a8" opacity="0.097"/><circle cx="243.8" cy="454" r="97.6" fill="#f3d9a8" opacity="0.060"/><circle cx="441.8" cy="559.6" r="33.4" fill="#f3d9a8" opacity="0.088"/><circle cx="151.4" cy="3.5" r="32.3" fill="#f3d9a8" opacity="0.116"/><circle cx="566.3" cy="143.4" r="36.4" fill="#f3d9a8" opacity="0.092"/>
  </g>

