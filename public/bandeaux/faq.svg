        fill="none" stroke="#c9a877" stroke-width="7.7" opacity="0.09"/><circle cx="567" cy="430" r="23.9" fill="#c9a877" opacity="0.072"/><path d="M 567 529.2 L 638.8 601 L 567 672.8 L 495.2 601 Z"
        fill="none" stroke="#c9a877" stroke-width="7.7" opacity="0.09"/><circle cx="567" cy="601" r="23.9" fill="#c9a877" opacity="0.072"/>
    <circle cx="290.4" cy="29.9" r="101.9" fill="#f3d9a8" opacity="0.052"/><circle cx="281.4" cy="696.4" r="110.4" fill="#f3d9a8" opacity="0.112"/><circle cx="857.7" cy="586" r="87.8" fill="#f3d9a8" opacity="0.106"/><circle cx="221.1" cy="594.8" r="72.2" fill="#f3d9a8" opacity="0.119"/><circle cx="704" cy="124.1" r="95.1" fill="#f3d9a8" opacity="0.138"/><circle cx="18.8" cy="314" r="45.1" fill="#f3d9a8" opacity="0.094"/><circle cx="107.7" cy="135.1" r="90.8" fill="#f3d9a8" opacity="0.116"/>
  </g>

