        fill="none" stroke="#7d5925" stroke-width="8.5" opacity="0.09"/><circle cx="654" cy="650" r="26.6" fill="#7d5925" opacity="0.072"/>
    <circle cx="190.7" cy="676.9" r="101.8" fill="#fff2dc" opacity="0.076"/><circle cx="210.2" cy="532.1" r="79" fill="#fff2dc" opacity="0.116"/><circle cx="158.8" cy="224" r="99.3" fill="#fff2dc" opacity="0.132"/><circle cx="179.4" cy="475.6" r="65.3" fill="#fff2dc" opacity="0.067"/><circle cx="612.8" cy="275.5" r="122.5" fill="#fff2dc" opacity="0.126"/><circle cx="334.5" cy="222.4" r="116.1" fill="#fff2dc" opacity="0.109"/><circle cx="896.2" cy="545.2" r="91.5" fill="#fff2dc" opacity="0.102"/>
  </g>

