        fill="none" stroke="#c9a877" stroke-width="7.7" opacity="0.09"/><circle cx="628.2" cy="414" r="23.9" fill="#c9a877" opacity="0.072"/><path d="M 628.2 513.2 L 700 585 L 628.2 656.8 L 556.4 585 Z"
