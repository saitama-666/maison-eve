        fill="none" stroke="#e0b878" stroke-width="7.7" opacity="0.09"/><circle cx="609" cy="585" r="23.9" fill="#e0b878" opacity="0.072"/>
    <circle cx="1171.1" cy="594.3" r="36" fill="#ffd89d" opacity="0.051"/><circle cx="56" cy="91.5" r="72.2" fill="#ffd89d" opacity="0.064"/><circle cx="273" cy="534.2" r="113.6" fill="#ffd89d" opacity="0.069"/><circle cx="271.5" cy="528.8" r="66.6" fill="#ffd89d" opacity="0.064"/><circle cx="681.3" cy="13.4" r="50.1" fill="#ffd89d" opacity="0.061"/><circle cx="556.8" cy="304.5" r="46.8" fill="#ffd89d" opacity="0.118"/><circle cx="909.5" cy="190.2" r="114.2" fill="#ffd89d" opacity="0.129"/>
  </g>

