        fill="none" stroke="#7d5925" stroke-width="5.1" opacity="0.09"/><circle cx="390" cy="390" r="16" fill="#7d5925" opacity="0.072"/>
    <circle cx="71.2" cy="262.5" r="57.9" fill="#fff2dc" opacity="0.076"/><circle cx="686.7" cy="28.6" r="41.7" fill="#fff2dc" opacity="0.138"/><circle cx="561.1" cy="350.1" r="70.5" fill="#fff2dc" opacity="0.132"/><circle cx="583.1" cy="103.2" r="40.3" fill="#fff2dc" opacity="0.067"/><circle cx="512.9" cy="269.2" r="40.6" fill="#fff2dc" opacity="0.074"/><circle cx="532" cy="107.7" r="26.8" fill="#fff2dc" opacity="0.095"/><circle cx="595.7" cy="393.4" r="36.1" fill="#fff2dc" opacity="0.063"/>
