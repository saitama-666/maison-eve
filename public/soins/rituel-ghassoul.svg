        fill="none" stroke="#d8b98c" stroke-width="5.1" opacity="0.09"/><circle cx="276" cy="276" r="16" fill="#d8b98c" opacity="0.072"/><path d="M 276 342.1 L 323.9 390 L 276 437.9 L 228.1 390 Z"
        fill="none" stroke="#d8b98c" stroke-width="5.1" opacity="0.09"/><circle cx="276" cy="390" r="16" fill="#d8b98c" opacity="0.072"/><path d="M 390 0.1 L 437.9 48 L 390 95.9 L 342.1 48 Z"
        fill="none" stroke="#d8b98c" stroke-width="5.1" opacity="0.09"/><circle cx="390" cy="48" r="16" fill="#d8b98c" opacity="0.072"/><path d="M 390 114.1 L 437.9 162 L 390 209.9 L 342.1 162 Z"
        fill="none" stroke="#d8b98c" stroke-width="5.1" opacity="0.09"/><circle cx="390" cy="162" r="16" fill="#d8b98c" opacity="0.072"/><path d="M 390 228.1 L 437.9 276 L 390 323.9 L 342.1 276 Z"
        fill="none" stroke="#d8b98c" stroke-width="5.1" opacity="0.09"/><circle cx="390" cy="276" r="16" fill="#d8b98c" opacity="0.072"/><path d="M 390 342.1 L 437.9 390 L 390 437.9 L 342.1 390 Z"
        fill="none" stroke="#d8b98c" stroke-width="5.1" opacity="0.09"/><circle cx="390" cy="390" r="16" fill="#d8b98c" opacity="0.072"/>
    <circle cx="771.7" cy="357" r="61.1" fill="#f6e4c6" opacity="0.054"/><circle cx="401.2" cy="213.9" r="31.5" fill="#f6e4c6" opacity="0.082"/><circle cx="774.2" cy="13.4" r="35" fill="#f6e4c6" opacity="0.103"/><circle cx="337.5" cy="400.8" r="77.3" fill="#f6e4c6" opacity="0.110"/><circle cx="555" cy="341.5" r="38.7" fill="#f6e4c6" opacity="0.056"/><circle cx="785.3" cy="316.6" r="45.3" fill="#f6e4c6" opacity="0.112"/><circle cx="147.9" cy="83" r="44.4" fill="#f6e4c6" opacity="0.127"/>
  </g>

