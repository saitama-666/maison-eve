        fill="none" stroke="#d8b98c" stroke-width="5.1" opacity="0.09"/><circle cx="162" cy="390" r="16" fill="#d8b98c" opacity="0.072"/><path d="M 276 0.1 L 323.9 48 L 276 95.9 L 228.1 48 Z"
