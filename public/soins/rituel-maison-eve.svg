        fill="none" stroke="#e0b878" stroke-width="5.1" opacity="0.09"/><circle cx="390" cy="48" r="16" fill="#e0b878" opacity="0.072"/><path d="M 390 114.1 L 437.9 162 L 390 209.9 L 342.1 162 Z"
        fill="none" stroke="#e0b878" stroke-width="5.1" opacity="0.09"/><circle cx="390" cy="162" r="16" fill="#e0b878" opacity="0.072"/><path d="M 390 228.1 L 437.9 276 L 390 323.9 L 342.1 276 Z"
        fill="none" stroke="#e0b878" stroke-width="5.1" opacity="0.09"/><circle cx="390" cy="276" r="16" fill="#e0b878" opacity="0.072"/><path d="M 390 342.1 L 437.9 390 L 390 437.9 L 342.1 390 Z"
        fill="none" stroke="#e0b878" stroke-width="5.1" opacity="0.09"/><circle cx="390" cy="390" r="16" fill="#e0b878" opacity="0.072"/>
    <circle cx="147.6" cy="2.6" r="44.7" fill="#ffd89d" opacity="0.124"/><circle cx="175.4" cy="366" r="37.5" fill="#ffd89d" opacity="0.126"/><circle cx="47.4" cy="115.9" r="28.7" fill="#ffd89d" opacity="0.086"/><circle cx="371.2" cy="107.1" r="53.2" fill="#ffd89d" opacity="0.059"/><circle cx="236.2" cy="260.9" r="30.5" fill="#ffd89d" opacity="0.120"/><circle cx="102.1" cy="99.4" r="35.9" fill="#ffd89d" opacity="0.117"/><circle cx="137.2" cy="361.9" r="29.8" fill="#ffd89d" opacity="0.076"/>
  </g>

  <rect width="800" height="600" fill="url(#lumiere)"/>

  
