        fill="none" stroke="#c9a877" stroke-width="5.1" opacity="0.09"/><circle cx="390" cy="48" r="16" fill="#c9a877" opacity="0.072"/><path d="M 390 114.1 L 437.9 162 L 390 209.9 L 342.1 162 Z"
        fill="none" stroke="#c9a877" stroke-width="5.1" opacity="0.09"/><circle cx="390" cy="162" r="16" fill="#c9a877" opacity="0.072"/><path d="M 390 228.1 L 437.9 276 L 390 323.9 L 342.1 276 Z"
        fill="none" stroke="#c9a877" stroke-width="5.1" opacity="0.09"/><circle cx="390" cy="276" r="16" fill="#c9a877" opacity="0.072"/><path d="M 390 342.1 L 437.9 390 L 390 437.9 L 342.1 390 Z"
        fill="none" stroke="#c9a877" stroke-width="5.1" opacity="0.09"/><circle cx="390" cy="390" r="16" fill="#c9a877" opacity="0.072"/>
    <circle cx="116.2" cy="24.2" r="71.3" fill="#f3d9a8" opacity="0.068"/><circle cx="60.1" cy="398.3" r="74.1" fill="#f3d9a8" opacity="0.097"/><circle cx="307.9" cy="71" r="50.1" fill="#f3d9a8" opacity="0.108"/><circle cx="565.9" cy="332.1" r="63.6" fill="#f3d9a8" opacity="0.106"/><circle cx="448.1" cy="317.9" r="27.4" fill="#f3d9a8" opacity="0.138"/><circle cx="127.6" cy="288.7" r="42.1" fill="#f3d9a8" opacity="0.103"/><circle cx="129.3" cy="96.8" r="68.6" fill="#f3d9a8" opacity="0.056"/>
  </g>

